<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Het hangkaartje</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
:root{--navy:#132B4F;--accent:#C4531A;--peach:#F8DCC8;--label:#FAF4EE;--fold:#E9DDD0;--ink:#16202E;--graphite:#4E5866;--sn:#7F93B3;--sl:#8C7A6C;--muted:#C3CDDD}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font:19px/1.65 'Atkinson Hyperlegible Next',system-ui,sans-serif;color:var(--ink);background:var(--peach)}
.canvas{background:var(--navy);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px);height:350px}
.wrap{width:1240px;margin:0 auto;position:relative}
header{height:96px;position:relative}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{font:400 30px 'Bree Serif';color:var(--label)}
nav{display:flex;gap:36px;font-weight:700;font-size:17px;color:var(--label)}
nav .on{box-shadow:inset 0 -3px var(--accent);padding-bottom:6px}
.pas{position:absolute;left:0;right:0;border-top:2px dashed var(--sn)}
h1{font:400 76px/1.02 'Bree Serif',Georgia,serif;color:var(--label);padding-top:56px}
h1 span{color:var(--peach)}
.lead{font-size:24px;color:var(--label);margin-top:18px}
.room{display:grid;grid-template-columns:6fr 5fr;gap:64px;margin-top:64px}
.form{position:relative;background:var(--label);padding:44px 52px 32px;box-shadow:0 10px 24px rgba(14,34,64,.16)}
.form:before,.form:after{content:"";position:absolute;top:0;bottom:0;width:16px;background:var(--fold)}
.form:before{left:0;border-right:2px dashed var(--sl)}.form:after{right:0;border-left:2px dashed var(--sl)}
.form h2{font:400 30px 'Bree Serif';color:var(--navy);padding-bottom:14px;border-bottom:2px dashed var(--sl);margin-bottom:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;font-weight:700;font-size:17px;margin-bottom:6px}
.field{height:56px;background:#fff;border:2px solid #B8AFA6;border-radius:2px;margin-bottom:18px}
.field.big{height:120px}
.tag{position:relative;margin-top:80px;background:#fff;padding:56px 40px 36px;transform:rotate(-3deg);box-shadow:0 10px 24px rgba(14,34,64,.18)}
.tag .hole{position:absolute;top:16px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--peach);border:2px solid var(--sl)}
.thread{position:absolute;left:50%;top:-86px;width:2px;height:104px;background:var(--accent);transform:rotate(-8deg)}
.route{display:flex;align-items:center;gap:14px;font:400 30px 'Bree Serif';color:var(--navy);padding:16px 0;border-bottom:2px dashed var(--sl)}
.route:last-of-type{border-bottom:0}
.route i{width:28px;height:28px;border:2.5px solid var(--navy);border-radius:4px}
.route b{margin-left:auto;font-family:system-ui;color:var(--accent)}
.note{font-size:18px;color:var(--graphite);margin-top:10px}
</style></head><body>
<div class="canvas">
<header><div class="wrap"><div class="brand">StudioLN</div>
<nav><span>Werkwijze</span><span>Prijzen</span><span>Projecten</span><span>Over mij</span><span class="on">Contact</span></nav>
</div><div class="pas" style="bottom:12px"></div><div class="pas" style="bottom:6px"></div></header>
<div class="wrap"><h1>Bel, mail of <span>stuur een bericht.</span></h1>
<p class="lead">Wat jij het makkelijkst vindt. Je hoort binnen één werkdag van me.</p></div>
</div>
<div class="wrap room">
 <div class="form">
  <h2>Stuur een bericht</h2>
  <div class="row"><div><label>Naam</label><div class="field"></div></div><div><label>E-mailadres</label><div class="field"></div></div></div>
  <label>Telefoonnummer (niet verplicht)</label><div class="field"></div>
  <label>Je bericht</label><div class="field big"></div>
 </div>
 <div><div class="tag"><span class="thread"></span><span class="hole"></span>
  <div class="route"><i></i>Bel 06 11 22 39 04<b>→</b></div>
  <div class="route"><i></i>Mail contact@studioln.nl<b>→</b></div>
  <p class="note">Ik neem zelf op. Lukt het even niet, dan bel ik je terug.</p>
 </div></div>
</div>
</body></html>
