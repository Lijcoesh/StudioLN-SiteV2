# Productie: bouwt de site en zet dist/ met rsync op de VPS (studioln.nl).
# Eenmalig instellen: zie deploy/README.md. Zonder die secrets faalt de job; dat is bedoeld.
name: Deploy to VPS

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: vps
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
              env:
                  # Repository variable (geen secret): het endpoint van het contactformulier.
                  # Leeg of niet gezet = het formulier blijft uit.
                  VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}

            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

            - name: Upload site
              run: rsync -az --delete dist/ deploy@${{ secrets.VPS_HOST }}:/var/www/studioln/site/
