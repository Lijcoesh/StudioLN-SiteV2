<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>De werkbon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
:root{--navy:#132B4F;--accent:#C4531A;--peach:#F8DCC8;--label:#FAF4EE;--fold:#E9DDD0;--ink:#16202E;--graphite:#4E5866;--sn:#7F93B3;--sl:#8C7A6C;--sa:#F6C9AC}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font:19px/1.65 'Atkinson Hyperlegible Next',system-ui,sans-serif;color:var(--ink);background:var(--peach)}
.canvas{background:var(--navy);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px);height:300px;color:var(--label)}
.wrap{width:1240px;margin:0 auto;position:relative}
header{height:96px;position:relative}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{font:400 30px 'Bree Serif'}
nav{display:flex;gap:36px;font-weight:700;font-size:17px}
nav .on{box-shadow:inset 0 -3px var(--accent);padding-bottom:6px}
.pas{position:absolute;left:0;right:0;border-top:2px dashed var(--sn)}
.open{display:grid;grid-template-columns:5fr 6fr;gap:64px;align-items:end;padding-top:52px}
h1{font:400 64px/1.04 'Bree Serif',Georgia,serif}
h1 span{color:var(--peach)}
.open p{font-size:23px;padding-bottom:6px}
.bon{position:relative;margin-top:56px;background:var(--label);padding:44px 72px 0;box-shadow:0 10px 24px rgba(14,34,64,.16);
 background-image:repeating-linear-gradient(90deg,rgba(19,43,79,.03) 0 2px,transparent 2px 4px)}
.bon:before,.bon:after{content:"";position:absolute;top:0;bottom:0;width:16px;background:var(--fold)}
.bon:before{left:0;border-right:2px dashed var(--sl)}.bon:after{right:0;border-left:2px dashed var(--sl)}
.top{position:absolute;left:16px;right:16px;top:14px;border-top:2px dashed var(--sl)}
.head{display:flex;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:2px dashed var(--sl);margin-bottom:20px}
.head b{font:400 30px 'Bree Serif';color:var(--navy)}
.head span{color:var(--graphite);font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
label{display:block;font-weight:700;font-size:17px;margin-bottom:6px}
.field{height:54px;background:#fff;border:2px solid #B8AFA6;border-radius:2px;margin-bottom:16px}
.field.big{height:96px}
.send{position:relative;display:inline-flex;gap:12px;background:var(--accent);color:#fff;font:400 24px 'Bree Serif';padding:14px 28px;margin-bottom:26px}
.send:before{content:"";position:absolute;inset:6px;border:2px dashed var(--sa)}
.perf{position:relative;margin:0 -72px;border-top:3px dotted var(--sl)}
.strips{display:grid;grid-template-columns:repeat(2,1fr);margin:0 -56px}
.strip{display:flex;align-items:center;justify-content:center;gap:14px;font:400 28px 'Bree Serif';color:var(--navy);height:96px;border-right:3px dotted var(--sl)}
.strip:last-child{border-right:0}
.strip b{color:var(--accent);font-family:system-ui}
</style></head><body>
<div class="canvas">
<header><div class="wrap"><div class="brand">StudioLN</div>
<nav><span>Werkwijze</span><span>Prijzen</span><span>Projecten</span><span>Over mij</span><span class="on">Contact</span></nav>
</div><div class="pas" style="bottom:12px"></div><div class="pas" style="bottom:6px"></div></header>
<div class="wrap open"><h1>Bel, mail of <span>stuur een bericht.</span></h1>
<p>Wat jij het makkelijkst vindt. Je hoort binnen één werkdag van me.</p></div>
</div>
<div class="wrap">
 <div class="bon"><span class="top"></span>
  <div class="head"><b>Bericht aan Luca</b><span>vul in wat je kwijt wilt, de rest vraag ik zelf</span></div>
  <div class="row"><div><label>Naam</label><div class="field"></div></div><div><label>E-mailadres</label><div class="field"></div></div><div><label>Telefoon (niet verplicht)</label><div class="field"></div></div></div>
  <label>Je bericht</label><div class="field big"></div>
  <span class="send">Verstuur bericht →</span>
  <div class="perf"></div>
  <div class="strips"><div class="strip">Bel 06 11 22 39 04<b>→</b></div><div class="strip">Mail contact@studioln.nl<b>→</b></div></div>
 </div>
</div>
</body></html>
