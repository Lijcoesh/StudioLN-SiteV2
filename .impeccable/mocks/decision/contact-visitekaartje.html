<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Het visitekaartje</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
:root{--navy:#132B4F;--accent:#C4531A;--peach:#F8DCC8;--label:#FAF4EE;--fold:#E9DDD0;--ink:#16202E;--graphite:#4E5866;--sn:#7F93B3;--sl:#8C7A6C;--muted:#C3CDDD;--sa:#F6C9AC}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font:19px/1.65 'Atkinson Hyperlegible Next',system-ui,sans-serif;color:var(--label);background:var(--navy);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px)}
.wrap{width:1240px;margin:0 auto;position:relative}
header{height:96px;position:relative}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{font:400 30px 'Bree Serif'}
nav{display:flex;gap:36px;font-weight:700;font-size:17px}
nav .on{box-shadow:inset 0 -3px var(--accent);padding-bottom:6px}
.pas{position:absolute;left:0;right:0;border-top:2px dashed var(--sn)}
.grid{display:grid;grid-template-columns:5fr 6fr;gap:64px;padding-top:64px}
h1{font:400 72px/1.04 'Bree Serif',Georgia,serif}
h1 span{display:block;color:var(--peach)}
.lead{font-size:23px;color:var(--muted);margin-top:16px;max-width:30ch}
.card{position:relative;margin-top:44px;background:var(--label);color:var(--ink);padding:30px 48px 22px;transform:rotate(-2deg);
 background-image:repeating-linear-gradient(90deg,rgba(19,43,79,.04) 0 2px,transparent 2px 4px);box-shadow:0 10px 24px rgba(14,34,64,.45)}
.card:before,.card:after{content:"";position:absolute;top:0;bottom:0;width:14px;background:var(--fold)}
.card:before{left:0;border-right:2px dashed var(--sl)}.card:after{right:0;border-left:2px dashed var(--sl)}
.card .who{font:400 30px 'Bree Serif';color:var(--navy)}
.card .who small{display:block;font:17px 'Atkinson Hyperlegible Next';color:var(--graphite)}
.r{display:flex;align-items:center;gap:14px;font:400 26px 'Bree Serif';color:var(--navy);padding:12px 0;border-top:2px dashed var(--sl)}
.r b{margin-left:auto;color:var(--accent);font-family:system-ui}
.pocket{position:relative;background:var(--peach);color:var(--ink);padding:52px 44px 28px;transform:rotate(1deg)}
.pocket:before{content:"";position:absolute;inset:8px;border:2px dashed var(--sl)}
.pocket .hem{position:absolute;left:8px;right:8px;top:22px;border-top:2px dashed var(--sl)}
.pocket h2{font:400 30px 'Bree Serif';color:var(--navy);margin-bottom:16px;position:relative}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative}
label{display:block;font-weight:700;font-size:17px;margin-bottom:6px}
.field{height:54px;background:#fff;border:2px solid #B8AFA6;border-radius:2px;margin-bottom:16px;position:relative}
.field.big{height:110px}
.send{position:relative;display:inline-flex;align-items:center;gap:12px;background:var(--accent);color:#fff;font:400 24px 'Bree Serif';padding:16px 28px}
.send:before{content:"";position:absolute;inset:6px;border:2px dashed var(--sa)}
</style></head><body>
<header><div class="wrap"><div class="brand">StudioLN</div>
<nav><span>Werkwijze</span><span>Prijzen</span><span>Projecten</span><span>Over mij</span><span class="on">Contact</span></nav>
</div><div class="pas" style="bottom:12px"></div><div class="pas" style="bottom:6px"></div></header>
<div class="wrap grid">
 <div>
  <h1>Bel, mail of <span>stuur een bericht.</span></h1>
  <p class="lead">Wat jij het makkelijkst vindt. Je hoort binnen één werkdag van me.</p>
  <div class="card">
   <div class="who">Luca<small>StudioLN, websites op maat</small></div>
   <div class="r">Bel 06 11 22 39 04<b>→</b></div>
   <div class="r">Mail contact@studioln.nl<b>→</b></div>
  </div>
 </div>
 <div class="pocket"><span class="hem"></span>
  <h2>Stuur een bericht</h2>
  <div class="row"><div><label>Naam</label><div class="field"></div></div><div><label>E-mailadres</label><div class="field"></div></div></div>
  <div style="position:relative"><label>Telefoonnummer (niet verplicht)</label><div class="field"></div>
  <label>Je bericht</label><div class="field big"></div></div>
  <span class="send">Verstuur bericht →</span>
 </div>
</div>
</body></html>
